<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 320" width="100%" height="100%">
  <defs>
    <linearGradient id="card-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="50%" stop-color="#070c18" />
      <stop offset="100%" stop-color="#040711" />
    </linearGradient>

    <linearGradient id="accent-bar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF7A00" />
      <stop offset="50%" stop-color="#FFA347" />
      <stop offset="100%" stop-color="#00F0FF" />
    </linearGradient>

    <filter id="card-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .title { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 18px; font-weight: 800; fill: #FF7A00; letter-spacing: 1.5px; }
    .subtitle { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 12px; font-weight: 600; fill: #00F0FF; letter-spacing: 1px; }
    .label { font-family: system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: #cbd5e1; }
    .val { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 16px; font-weight: 800; fill: #ffffff; }
    .lang-name { font-family: system-ui, sans-serif; font-size: 12px; font-weight: 700; fill: #f8fafc; }
    .lang-pct { font-family: system-ui, sans-serif; font-size: 11px; font-weight: 600; fill: #94a3b8; }
  </style>

  <!-- Card Frame -->
  <rect x="2" y="2" width="846" height="316" rx="16" fill="url(#card-bg)" stroke="#FF7A00" stroke-width="1.2" opacity="0.95" />

  <!-- Header Section -->
  <g transform="translate(35, 42)">
    <!-- Terminal Dot Controls -->
    <circle cx="0" cy="0" r="5" fill="#EF4444" />
    <circle cx="15" cy="0" r="5" fill="#F59E0B" />
    <circle cx="30" cy="0" r="5" fill="#10B981" />

    <text x="50" y="4" class="title">AKHIL DEV // TELEMETRY &amp; METRICS</text>
    <text x="50" y="22" class="subtitle">STATUS: 🟢 ORBITAL SYSTEMS ACTIVE</text>
  </g>

  <!-- Divider Line -->
  <line x1="35" y1="80" x2="815" y2="80" stroke="rgba(255, 122, 0, 0.2)" stroke-width="1" />

  <!-- Left Column: Core GitHub Metrics -->
  <g transform="translate(35, 105)">
    <!-- Metric 1 -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="370" height="42" rx="8" fill="rgba(15, 23, 42, 0.6)" stroke="rgba(255, 122, 0, 0.2)" stroke-width="1" />
      <text x="16" y="26" class="label">📦 Public Repositories</text>
      <text x="340" y="26" text-anchor="end" class="val" fill="#FF7A00">15 Active</text>
    </g>

    <!-- Metric 2 -->
    <g transform="translate(0, 52)">
      <rect x="0" y="0" width="370" height="42" rx="8" fill="rgba(15, 23, 42, 0.6)" stroke="rgba(255, 122, 0, 0.2)" stroke-width="1" />
      <text x="16" y="26" class="label">⚡ Core Architecture</text>
      <text x="340" y="26" text-anchor="end" class="val" fill="#00F0FF">AI &amp; Agents</text>
    </g>

    <!-- Metric 3 -->
    <g transform="translate(0, 104)">
      <rect x="0" y="0" width="370" height="42" rx="8" fill="rgba(15, 23, 42, 0.6)" stroke="rgba(255, 122, 0, 0.2)" stroke-width="1" />
      <text x="16" y="26" class="label">🔥 Contribution Velocity</text>
      <text x="340" y="26" text-anchor="end" class="val" fill="#34D399">High Active</text>
    </g>

    <!-- Metric 4 -->
    <g transform="translate(0, 156)">
      <rect x="0" y="0" width="370" height="42" rx="8" fill="rgba(15, 23, 42, 0.6)" stroke="rgba(255, 122, 0, 0.2)" stroke-width="1" />
      <text x="16" y="26" class="label">🛡️ Security &amp; Guardrails</text>
      <text x="340" y="26" text-anchor="end" class="val" fill="#F472B6">100% Verified</text>
    </g>
  </g>

  <!-- Right Column: Top Languages Distribution -->
  <g transform="translate(445, 105)">
    <text x="0" y="16" font-family="'Space Grotesk', system-ui, sans-serif" font-size="14" font-weight="700" fill="#f8fafc" letter-spacing="1">PRIMARY LANGUAGE STACK</text>

    <!-- Language 1: Python -->
    <g transform="translate(0, 36)">
      <circle cx="5" cy="0" r="4" fill="#3776AB" />
      <text x="16" y="4" class="lang-name">Python (AI / Vision / Agents)</text>
      <text x="370" y="4" text-anchor="end" class="lang-pct">42%</text>
      <rect x="0" y="12" width="370" height="7" rx="3.5" fill="#1E293B" />
      <rect x="0" y="12" width="155" height="7" rx="3.5" fill="#3776AB" />
    </g>

    <!-- Language 2: TypeScript & Web -->
    <g transform="translate(0, 78)">
      <circle cx="5" cy="0" r="4" fill="#3178C6" />
      <text x="16" y="4" class="lang-name">TypeScript &amp; Next.js</text>
      <text x="370" y="4" text-anchor="end" class="lang-pct">28%</text>
      <rect x="0" y="12" width="370" height="7" rx="3.5" fill="#1E293B" />
      <rect x="0" y="12" width="103" height="7" rx="3.5" fill="#3178C6" />
    </g>

    <!-- Language 3: JavaScript -->
    <g transform="translate(0, 120)">
      <circle cx="5" cy="0" r="4" fill="#F7DF1E" />
      <text x="16" y="4" class="lang-name">JavaScript (Full-Stack)</text>
      <text x="370" y="4" text-anchor="end" class="lang-pct">18%</text>
      <rect x="0" y="12" width="370" height="7" rx="3.5" fill="#1E293B" />
      <rect x="0" y="12" width="66" height="7" rx="3.5" fill="#F7DF1E" />
    </g>

    <!-- Language 4: C / C++ -->
    <g transform="translate(0, 162)">
      <circle cx="5" cy="0" r="4" fill="#00599C" />
      <text x="16" y="4" class="lang-name">C / C++ (Low-Latency)</text>
      <text x="370" y="4" text-anchor="end" class="lang-pct">12%</text>
      <rect x="0" y="12" width="370" height="7" rx="3.5" fill="#1E293B" />
      <rect x="0" y="12" width="44" height="7" rx="3.5" fill="#00599C" />
    </g>
  </g>
</svg>
