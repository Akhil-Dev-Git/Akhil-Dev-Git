<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="act-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1322" />
      <stop offset="50%" stop-color="#070c18" />
      <stop offset="100%" stop-color="#040711" />
    </linearGradient>

    <!-- Wave Area Underfill -->
    <linearGradient id="wave-area-fill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF7A00" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#FF7A00" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#040711" stop-opacity="0" />
    </linearGradient>

    <!-- Glowing Path Stroke Gradient -->
    <linearGradient id="wave-stroke-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="25%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#FF7A00" />
      <stop offset="75%" stop-color="#FFA347" />
      <stop offset="100%" stop-color="#00F0FF" />
    </linearGradient>

    <!-- Particle Glow Filter -->
    <filter id="laser-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="intense-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes dash-travel {
      from { stroke-dashoffset: 2000; }
      to { stroke-dashoffset: 0; }
    }
    @keyframes beacon-pulse {
      0%, 100% { r: 5px; opacity: 0.8; }
      50% { r: 8px; opacity: 1; }
    }
    @keyframes grid-glow {
      0%, 100% { opacity: 0.15; }
      50% { opacity: 0.3; }
    }

    .laser-line {
      stroke-dasharray: 120 400;
      animation: dash-travel 8s linear infinite;
    }
    .beacon {
      animation: beacon-pulse 2.5s ease-in-out infinite;
    }
    .grid-line {
      animation: grid-glow 4s ease-in-out infinite;
    }
  </style>

  <!-- Large Outer Box Frame with Cyber Neon Stroke -->
  <rect x="2" y="2" width="896" height="276" rx="18" fill="url(#act-bg)" stroke="#FF7A00" stroke-width="1.5" opacity="0.95" />

  <!-- Top Header Bar with Generous Margin -->
  <g transform="translate(35, 34)">
    <!-- Terminal Status Lights -->
    <circle cx="0" cy="0" r="4.5" fill="#EF4444" />
    <circle cx="14" cy="0" r="4.5" fill="#F59E0B" />
    <circle cx="28" cy="0" r="4.5" fill="#10B981" />

    <text x="44" y="4.5" font-family="'Space Grotesk', system-ui, sans-serif" font-size="13" font-weight="800" fill="#FF7A00" letter-spacing="1.5">CONTINUOUS DEPLOYMENT &amp; VELOCITY PULSE</text>

    <!-- Right Side Status Badge (Roomy and unclipped) -->
    <g transform="translate(620, -1)">
      <circle cx="0" cy="0" r="4.5" fill="#00F0FF" filter="url(#laser-glow)">
        <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="12" y="4" font-family="'Space Grotesk', system-ui, sans-serif" font-size="11" font-weight="700" fill="#00F0FF" letter-spacing="1">LIVE ARCHITECT</text>
    </g>
  </g>

  <!-- Horizontal Measurement Grid Lines -->
  <g stroke="#FF7A00" stroke-width="1" class="grid-line">
    <line x1="35" y1="75" x2="865" y2="75" stroke-dasharray="4 8" />
    <line x1="35" y1="125" x2="865" y2="125" stroke-dasharray="4 8" />
    <line x1="35" y1="175" x2="865" y2="175" stroke-dasharray="4 8" />
    <line x1="35" y1="225" x2="865" y2="225" stroke-dasharray="4 8" />
  </g>

  <!-- Y-Axis Subtle Velocity Benchmarks -->
  <text x="42" y="71" font-family="monospace" font-size="9" fill="#64748B" font-weight="600">HIGH FREQUENCY // AI WORKFLOWS</text>
  <text x="42" y="121" font-family="monospace" font-size="9" fill="#64748B" font-weight="600">STABLE PEAK // MULTI-AGENT SWARMS</text>
  <text x="42" y="171" font-family="monospace" font-size="9" fill="#64748B" font-weight="600">SUSTAINED VELOCITY // LOCAL RAG</text>

  <!-- Continuous Bezier Wave Path Definition (Spacious & Dynamic) -->
  <!-- Path String: M 40 210 C 100 200, 140 130, 200 130 C 260 130, 290 190, 350 190 C 410 190, 440 90, 500 90 C 560 90, 600 230, 660 230 C 720 230, 750 95, 800 115 C 830 125, 850 145, 865 140 -->

  <!-- Filled Area Under Curve -->
  <path d="M 40 210 C 100 200, 140 130, 200 130 C 260 130, 290 190, 350 190 C 410 190, 440 90, 500 90 C 560 90, 600 230, 660 230 C 720 230, 750 95, 800 115 C 830 125, 850 145, 865 140 L 865 245 L 40 245 Z" fill="url(#wave-area-fill)" />

  <!-- Base Glowing Wave Line -->
  <path id="motionPath" d="M 40 210 C 100 200, 140 130, 200 130 C 260 130, 290 190, 350 190 C 410 190, 440 90, 500 90 C 560 90, 600 230, 660 230 C 720 230, 750 95, 800 115 C 830 125, 850 145, 865 140" fill="none" stroke="url(#wave-stroke-grad)" stroke-width="2.8" opacity="0.6" />

  <!-- Animated High-Intensity Laser Pulse Traveling Along the Path -->
  <path d="M 40 210 C 100 200, 140 130, 200 130 C 260 130, 290 190, 350 190 C 410 190, 440 90, 500 90 C 560 90, 600 230, 660 230 C 720 230, 750 95, 800 115 C 830 125, 850 145, 865 140" fill="none" stroke="#00F0FF" stroke-width="3.5" class="laser-line" filter="url(#laser-glow)" />

  <!-- ================= ANIMATED TRAVELING DOTS (Traveling Along Path) ================= -->

  <!-- Traveling Dot 1: Electric Cyan Lead Orb -->
  <g>
    <circle r="7" fill="#00F0FF" filter="url(#laser-glow)">
      <animate attributeName="opacity" values="0.8;1;0.8" dur="1.5s" repeatCount="indefinite" />
    </circle>
    <circle r="3.5" fill="#FFFFFF" />
    <animateMotion dur="7s" repeatCount="indefinite" rotate="auto">
      <mpath href="#motionPath" />
    </animateMotion>
  </g>

  <!-- Traveling Dot 2: Fiery Solar Orange Orb (Staggered by 2.3s) -->
  <g>
    <circle r="7.5" fill="#FF7A00" filter="url(#laser-glow)">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="1.8s" repeatCount="indefinite" />
    </circle>
    <circle r="3.5" fill="#FFF275" />
    <animateMotion dur="7s" begin="-2.33s" repeatCount="indefinite" rotate="auto">
      <mpath href="#motionPath" />
    </animateMotion>
  </g>

  <!-- Traveling Dot 3: Liquid Gold Cosmic Orb (Staggered by 4.6s) -->
  <g>
    <circle r="7" fill="#FFD166" filter="url(#laser-glow)">
      <animate attributeName="opacity" values="0.9;1;0.9" dur="1.2s" repeatCount="indefinite" />
    </circle>
    <circle r="3" fill="#FFFFFF" />
    <animateMotion dur="7s" begin="-4.66s" repeatCount="indefinite" rotate="auto">
      <mpath href="#motionPath" />
    </animateMotion>
  </g>

  <!-- Traveling Dot 4: High-Speed Micro Particle (Speed: 3.5s) -->
  <g>
    <circle r="4" fill="#38BDF8" filter="url(#laser-glow)" />
    <circle r="2" fill="#FFFFFF" />
    <animateMotion dur="3.5s" begin="-1s" repeatCount="indefinite" rotate="auto">
      <mpath href="#motionPath" />
    </animateMotion>
  </g>

  <!-- Traveling Dot 5: Subtle Trail Particle -->
  <g>
    <circle r="4" fill="#FFA347" filter="url(#laser-glow)" />
    <animateMotion dur="3.5s" begin="-2.75s" repeatCount="indefinite" rotate="auto">
      <mpath href="#motionPath" />
    </animateMotion>
  </g>

  <!-- Fixed Anchor Milestone Nodes along Key Peak Waves -->
  <!-- Milestone 1 -->
  <circle cx="200" cy="130" r="5" fill="#00F0FF" opacity="0.85" filter="url(#laser-glow)" />
  <circle cx="200" cy="130" r="2.5" fill="#FFFFFF" />
  <!-- Milestone 2 -->
  <circle cx="350" cy="190" r="5" fill="#FF7A00" opacity="0.85" filter="url(#laser-glow)" />
  <circle cx="350" cy="190" r="2.5" fill="#FFFFFF" />
  <!-- Milestone 3 -->
  <circle cx="500" cy="90" r="6" fill="#FFD166" opacity="0.9" filter="url(#laser-glow)" class="beacon" />
  <circle cx="500" cy="90" r="3" fill="#FFFFFF" />
  <!-- Milestone 4 -->
  <circle cx="660" cy="230" r="5" fill="#FF7A00" opacity="0.85" filter="url(#laser-glow)" />
  <circle cx="660" cy="230" r="2.5" fill="#FFFFFF" />
  <!-- Milestone 5 -->
  <circle cx="800" cy="115" r="5.5" fill="#00F0FF" opacity="0.85" filter="url(#laser-glow)" />
  <circle cx="800" cy="115" r="2.5" fill="#FFFFFF" />

  <!-- Bottom Timeline Labels -->
  <g transform="translate(0, 258)" font-family="'Space Grotesk', monospace" font-size="10" font-weight="600" fill="#64748B">
    <text x="40" y="0">GENESIS</text>
    <text x="200" y="0" text-anchor="middle">ML MODELS</text>
    <text x="350" y="0" text-anchor="middle">DEEP LEARNING</text>
    <text x="500" y="0" text-anchor="middle" fill="#FF7A00">AGENT SWARMS</text>
    <text x="660" y="0" text-anchor="middle">LOCAL LLMs</text>
    <text x="830" y="0" text-anchor="middle" fill="#00F0FF">AUTONOMOUS</text>
  </g>
</svg>
