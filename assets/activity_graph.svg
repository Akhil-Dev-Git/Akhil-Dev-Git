<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 180" width="100%" height="100%">
  <defs>
    <linearGradient id="act-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="50%" stop-color="#070c18" />
      <stop offset="100%" stop-color="#040711" />
    </linearGradient>

    <linearGradient id="wave-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF7A00" stop-opacity="0.45" />
      <stop offset="70%" stop-color="#FF7A00" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#040711" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="line-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="35%" stop-color="#FF7A00" />
      <stop offset="70%" stop-color="#FFA347" />
      <stop offset="100%" stop-color="#00F0FF" />
    </linearGradient>

    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes pulse-dot {
      0%, 100% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.4); opacity: 1; }
    }
    .pulse-pt {
      transform-box: fill-box;
      transform-origin: center;
      animation: pulse-dot 2.5s ease-in-out infinite;
    }
  </style>

  <!-- Frame -->
  <rect x="2" y="2" width="846" height="176" rx="14" fill="url(#act-bg)" stroke="#FF7A00" stroke-width="1.2" opacity="0.95" />

  <!-- Title & Legend -->
  <g transform="translate(30, 28)">
    <text x="0" y="0" font-family="'Space Grotesk', system-ui, sans-serif" font-size="13" font-weight="800" fill="#FF7A00" letter-spacing="1">CONTINUOUS DEPLOYMENT &amp; VELOCITY PULSE</text>
    <circle cx="750" cy="-4" r="4" fill="#00F0FF" />
    <text x="762" y="0" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#cbd5e1">Active Architect</text>
  </g>

  <!-- Grid lines -->
  <g stroke="rgba(255, 122, 0, 0.12)" stroke-dasharray="3 5">
    <line x1="30" y1="55" x2="820" y2="55" />
    <line x1="30" y1="95" x2="820" y2="95" />
    <line x1="30" y1="135" x2="820" y2="135" />
  </g>

  <!-- Filled Wave Area -->
  <path d="M 30 150 L 30 135 Q 70 120 110 100 T 190 75 T 270 110 T 350 65 T 430 85 T 510 50 T 590 80 T 670 45 T 750 60 L 820 50 L 820 150 Z" fill="url(#wave-grad)" />

  <!-- Glowing Wave Line -->
  <path d="M 30 135 Q 70 120 110 100 T 190 75 T 270 110 T 350 65 T 430 85 T 510 50 T 590 80 T 670 45 T 750 60 L 820 50" fill="none" stroke="url(#line-grad)" stroke-width="2.5" filter="url(#neon-glow)" />

  <!-- Data Pulse Points -->
  <circle cx="110" cy="100" r="4" fill="#00F0FF" class="pulse-pt" />
  <circle cx="190" cy="75" r="4" fill="#FF7A00" class="pulse-pt" />
  <circle cx="270" cy="110" r="4" fill="#00F0FF" class="pulse-pt" />
  <circle cx="350" cy="65" r="5" fill="#FFD166" class="pulse-pt" />
  <circle cx="430" cy="85" r="4" fill="#FF7A00" class="pulse-pt" />
  <circle cx="510" cy="50" r="5" fill="#00F0FF" class="pulse-pt" />
  <circle cx="590" cy="80" r="4" fill="#FFA347" class="pulse-pt" />
  <circle cx="670" cy="45" r="5" fill="#FFD166" class="pulse-pt" />
  <circle cx="750" cy="60" r="4" fill="#00F0FF" class="pulse-pt" />
  <circle cx="820" cy="50" r="4" fill="#FF7A00" class="pulse-pt" />
</svg>
